model: models/yolo11n.pt
data: data/raw/augmented_dataset/augmented_dataset/data.yaml

epochs: 60
imgsz: 640
batch: 8
device: cpu
amp: false
workers: 0

project: runs
name: police_bike
exist_ok: false
seed: 42
deterministic: true
verbose: true
heartbeat_seconds: 60

optimizer: auto
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
patience: 15

freeze: 10
close_mosaic: 10
cache: false
plots: true

hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.3
mixup: 0.0
copy_paste: 0.0

recall_targets:
  police_bike:
    recall: 0.80

precision_targets:
  police_bike:
    precision: 0.85

min_class_instances:
  police_bike: 100

conf_sweep:
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  min_precision: 0.90

export:
  format: onnx
  int8: false
  simplify: true
  opset: 12
