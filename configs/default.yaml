video:
  input: data/raw/video/Road traffic video for object recognition.mp4
  output: runs/vision/output.mp4
  report: runs/vision/report.json

model:
  path: models/yolo11n.pt
  confidence_threshold: 0.35
  image_size: 640
  # rare, small classes get a lower bar so they survive the global threshold
  class_thresholds:
    motorcycle: 0.15
    traffic-police motorcycle: 0.15

tracker:
  max_distance_px: 80
  max_lost_frames: 10

class_colors:
  car: [255, 128, 0]
  van: [0, 165, 255]
  bus: [0, 255, 255]
  truck: [0, 180, 0]
  motorcycle: [255, 0, 255]
  traffic-police motorcycle: [255, 255, 0]

toll_prices:
  car: 1.0
  van: 1.5
  bus: 2.0
  truck: 2.5
  motorcycle: 0.0
  traffic-police motorcycle: 0.0

counting_lines:
  - name: main
    points: [[16, 403], [1090, 403]]
    inbound_when_crossing: top_to_bottom
    # hold fire while a track sits inside this band, so a vehicle stopped on
    # the line cannot be counted twice or counted on a jittery bounce
    deadband_px: 12

speed_limit_kph: 80.0

speed:
  enabled: true
  calibration: configs/calibration.json
  hysteresis_kph: 3.0
  smoothing_alpha: 0.3
  # jitter in the bbox turns into phantom speed once you divide by dt;
  # smooth the ground position BEFORE differencing
  position_alpha: 0.3
  min_step_meters: 0.15
  max_plausible_kph: 160.0

enhancement:
  enabled: true
  denoise: true
  denoise_diameter: 5
  denoise_sigma_color: 40.0
  denoise_sigma_space: 40.0
  clahe: true
  clahe_clip_limit: 2.0
  clahe_grid: 8
  sharpen: true
  sharpen_radius: 3.0
  sharpen_amount: 0.6

runtime:
  max_frames: 15
  display: false
